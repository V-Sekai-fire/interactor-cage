name: lean

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          path: 3-interactor/cage
      - uses: actions/checkout@v4
        with:
          repository: V-Sekai-fire/contract-lbfgsb
          path: 2-contract/lbfgsb
      - name: Lean
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: lake build (lean)
        working-directory: 3-interactor/cage/lean
        run: |
          lake build Cage emit_cage
